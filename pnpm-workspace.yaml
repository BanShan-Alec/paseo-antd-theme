packages:
  - "packages/*"

# pnpm 11 renamed `onlyBuiltDependencies` to this map and made
# `strictDepBuilds` default to true: an unreviewed postinstall script now fails
# the install instead of printing a warning. These two place native binaries
# (esbuild for Vite/Vitest, oxide for the Tailwind v4 CSS build).
allowBuilds:
  esbuild: true
  "@tailwindcss/oxide": true
